document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';

      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');

    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

r-radius:99px;padding:3px\">\n<span style=\"padding:5px 9px;border-radius:99px;background:oklch(72% .13 220);color:#0d1030\">EN<\u002Fspan>\n<span sc-camel-on-click=\"{{ goHe }}\" style=\"padding:5px 9px;border-radius:99px;cursor:pointer;color:rgba(238,240,250,.6)\">עב<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"top\" style=\"position:relative;padding:104px 60px 88px;overflow:hidden\">\n<div style=\"position:absolute;inset:-45% 32% 28% -12%;background:radial-gradient(closest-side,oklch(55% .16 265 / .48),transparent);pointer-events:none\"><\u002Fdiv>\n<div data-ring=\"\" style=\"position:absolute;right:-8%;top:2%;width:560px;height:560px;border-radius:50%;border:1px solid rgba(238,240,250,.11)\"><\u002Fdiv>\n<div data-ring2=\"\" style=\"position:absolute;right:1%;top:13%;width:400px;height:400px;border-radius:50%;border:1px solid rgba(238,240,250,.08)\"><\u002Fdiv>\n<div style=\"position:relative;max-width:800px\">\n<div style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220);margin-bottom:26px\">ISRAELI TECHNOLOGY COMPANY · EST. 2024<\u002Fdiv>\n<h1 style=\"margin:0;font-size:68px;line-height:1.02;letter-spacing:-.04em;font-weight:700;text-wrap:balance\">We build technology that solves real problems.<\u002Fh1>\n<p style=\"margin:28px 0 0;font-size:18px;line-height:1.6;max-width:60ch;color:rgba(238,240,250,.7)\">Swed Technology identifies real needs in traditional markets and builds the digital platforms that resolve them — mobile applications, SaaS systems, cloud infrastructure and AI, engineered end to end.<\u002Fp>\n<div style=\"display:flex;gap:12px;margin-top:38px\">\n<a href=\"#contact\" style=\"padding:14px 26px;border-radius:99px;background:oklch(72% .13 220);color:#0d1030;font-size:14px;font-weight:700\">Start a project<\u002Fa>\n<a href=\"#products\" style=\"padding:14px 26px;border-radius:99px;border:1px solid rgba(238,240,250,.25);font-size:14px;font-weight:500\">See our products<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"position:relative;display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:64px;max-width:900px\">\n<a href=\"#dolphin\" data-lift=\"\" style=\"display:block;background:rgba(238,240,250,.06);border:1px solid rgba(238,240,250,.12);border-radius:16px;padding:26px\" style-hover=\"background:rgba(238,240,250,.1)\">\n<div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.14em;color:rgba(238,240,250,.45)\">PRODUCT 01<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:12px\">Dolphin<\u002Fdiv>\n<div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.62);margin-top:8px\">The digital platform for the diving world — divers, clubs and organisations in one system.<\u002Fdiv>\n<\u002Fa>\n<a href=\"#shekel\" data-lift=\"\" style=\"display:block;background:rgba(238,240,250,.06);border:1px solid rgba(238,240,250,.12);border-radius:16px;padding:26px\" style-hover=\"background:rgba(238,240,250,.1)\">\n<div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.14em;color:rgba(238,240,250,.45)\">PRODUCT 02<\u002Fdiv>\n<div style=\"font-size:26px;font-weight:700;letter-spacing:-.025em;margin-top:12px\">Machatzit HaShekel<\u002Fdiv>\n<div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.62);margin-top:8px\">Donations, donor relationships and community management for institutions and non-profits.<\u002Fdiv>\n<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"about\" style=\"background:#f5f6fb;color:#0d1030;padding:84px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:38px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:#383f87\">WHO WE ARE<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(13,16,48,.15)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1.15fr 1fr;gap:72px;align-items:start\">\n<div>\n<h2 style=\"margin:0;font-size:40px;line-height:1.08;letter-spacing:-.035em;font-weight:700;max-width:22ch\">A product company built around real needs, not trends.<\u002Fh2>\n<p style=\"margin:22px 0 0;font-size:16.5px;line-height:1.65;color:rgba(13,16,48,.68)\">Swed Technology LTD was incorporated in Israel in 2024 as a private company, founded on a simple observation: entire industries still run on paper, spreadsheets and phone calls. We look for those markets, understand how they actually work, and build digital platforms that fit them.<\u002Fp>\n<p style=\"margin:16px 0 0;font-size:16.5px;line-height:1.65;color:rgba(13,16,48,.68)\">The company is led by a product engineer with years of experience in financial systems, insurance platforms, UX and complex system development — a background that shapes how we build: documented, tested, secured and maintained long after launch.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:34px\">\n<div style=\"background:#fff;border:1px solid rgba(13,16,48,.1);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.12em;color:#383f87\">OUR MISSION<\u002Fdiv><p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:rgba(13,16,48,.72)\">To turn traditional, manual processes into simple digital products that people actually want to use.<\u002Fp><\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(13,16,48,.1);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.12em;color:#383f87\">OUR VISION<\u002Fdiv><p style=\"margin:10px 0 0;font-size:15px;line-height:1.6;color:rgba(13,16,48,.72)\">An ecosystem of digital platforms, each solving a real problem in its own market, built to last.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;gap:0;border-top:1px solid rgba(13,16,48,.14)\">\n<div style=\"padding:18px 0;border-bottom:1px solid rgba(13,16,48,.1)\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Technology that solves real problems<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(13,16,48,.6);margin-top:5px\">We start from the need, never from the stack.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:18px 0;border-bottom:1px solid rgba(13,16,48,.1)\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Products that change traditional processes<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(13,16,48,.6);margin-top:5px\">Replacing paperwork, not digitising it.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:18px 0;border-bottom:1px solid rgba(13,16,48,.1)\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Systems that are simple, smart and accessible<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(13,16,48,.6);margin-top:5px\">If it needs a manual, it isn't finished.<\u002Fdiv><\u002Fdiv>\n<div style=\"padding:18px 0\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Long-term impact<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(13,16,48,.6);margin-top:5px\">We stay with a product for years, not for a launch.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"expertise\" style=\"padding:84px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:38px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220)\">EXPERTISE<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(238,240,250,.18)\"><\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 40px;font-size:38px;letter-spacing:-.035em;font-weight:700;max-width:24ch\">End-to-end capability, under one roof.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px\">\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">01<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">SaaS Platforms<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Multi-tenant systems with roles, billing and audit built in.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">02<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Mobile Applications<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">iOS and Android, from prototype to store release.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">03<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Web Development<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Responsive web systems and public-facing platforms.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">04<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Cloud Solutions<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Scalable infrastructure that grows with usage.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">05<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">UX &amp; UI Design<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Interfaces designed for people who aren't technical.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">06<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">API Integration<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Connecting systems that were never meant to talk.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">07<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Process Automation<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Removing the manual steps that cost the most time.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">08<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Information Security<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Secure payments, permissions and data by design.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">09<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Artificial Intelligence<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">AI where it measurably changes the outcome.<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:22px\"><div style=\"font:500 10.5px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">10<\u002Fdiv><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em;margin-top:12px\">Management Systems<\u002Fdiv><div style=\"font-size:13.5px;line-height:1.55;color:rgba(238,240,250,.58);margin-top:6px\">Admin, reporting and back-office tooling.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"products\" style=\"background:#f5f6fb;color:#0d1030;padding:84px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:38px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:#383f87\">OUR PRODUCTS — 01 / 02<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(13,16,48,.15)\"><\u002Fspan><\u002Fdiv>\n\n<div id=\"dolphin\" style=\"display:grid;grid-template-columns:440px 1fr;gap:56px;align-items:center;scroll-margin-top:80px\">\n<div style=\"height:380px;border-radius:20px;background:repeating-linear-gradient(135deg,rgba(56,63,135,.1) 0 9px,transparent 9px 18px),#eceef8;display:flex;align-items:center;justify-content:center\"><span style=\"font:400 11px/1 IBM Plex Mono,monospace;color:rgba(13,16,48,.45)\">DOLPHIN APP SCREENS<\u002Fspan><\u002Fdiv>\n<div>\n<img src=\"76a7ad3d-1c08-4d9d-b30e-a707e040525a\" alt=\"Dolphin\" style=\"height:76px;display:block;margin:0 0 18px\">\n<h3 style=\"margin:0;font-size:36px;letter-spacing:-.03em;font-weight:700\">The digital platform for the diving world.<\u002Fh3>\n<p style=\"margin:16px 0 0;font-size:16px;line-height:1.65;max-width:56ch;color:rgba(13,16,48,.66)\">Dolphin connects divers, dive clubs and diving organisations through a digital dive log, document management, courses, insurance and complementary services — replacing paper logbooks and scattered certificates with one platform.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-top:24px;font-size:14.5px;color:rgba(13,16,48,.75)\">\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Digital dive log<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Diver document management<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Dive insurance<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Dive club management<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Course registration<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Photo documentation<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Reminders &amp; renewals<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Digital signature<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:26px;font-size:13px;font-weight:600\"><span style=\"padding:11px 18px;border-radius:99px;background:#383f87;color:#fff\">App Store<\u002Fspan><span style=\"padding:11px 18px;border-radius:99px;border:1px solid rgba(13,16,48,.2)\">Google Play<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"shekel\" style=\"display:grid;grid-template-columns:1fr 440px;gap:56px;align-items:center;margin-top:56px;padding-top:52px;border-top:1px solid rgba(13,16,48,.14);scroll-margin-top:80px\">\n<div>\n<div style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:#383f87;margin-bottom:14px\">MACHATZIT HASHEKEL · מחצית השקל<\u002Fdiv>\n<h3 style=\"margin:0;font-size:36px;letter-spacing:-.03em;font-weight:700\">Donations and community management for institutions.<\u002Fh3>\n<p style=\"margin:16px 0 0;font-size:16px;line-height:1.65;max-width:56ch;color:rgba(13,16,48,.66)\">A digital system for synagogues, yeshivas, educational institutions and non-profits: fundraising, donor and congregant relationships, secure payment processing, direct communication and community management in one place.<\u002Fp>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-top:24px;font-size:14.5px;color:rgba(13,16,48,.75)\">\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Donation page per institution<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Secure payment processing<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Donor management<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Receipt generation<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Reports &amp; analytics<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Campaign management<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Admin interface<\u002Fdiv>\n<div style=\"display:flex;gap:9px;align-items:baseline\"><span style=\"color:#383f87\">—<\u002Fspan>Cloud-based, no installation<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:flex;gap:10px;margin-top:26px;font-size:13px;font-weight:600\"><span style=\"padding:11px 18px;border-radius:99px;background:#383f87;color:#fff\">Request a demo<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"height:380px;border-radius:20px;background:repeating-linear-gradient(135deg,rgba(56,63,135,.1) 0 9px,transparent 9px 18px),#eceef8;display:flex;align-items:center;justify-content:center\"><span style=\"font:400 11px/1 IBM Plex Mono,monospace;color:rgba(13,16,48,.45)\">MACHATZIT HASHEKEL SCREENS<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:84px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:38px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220)\">WHY SWED TECHNOLOGY<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(238,240,250,.18)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1.4fr;gap:64px;align-items:start\">\n<h2 style=\"margin:0;font-size:38px;line-height:1.08;letter-spacing:-.035em;font-weight:700\">Product thinking, engineered to last.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:26px 40px\">\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Product thinking first<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:5px\">We ask what the user is trying to accomplish before we write a line of code.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">End-to-end development<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:5px\">Research, design, build, release and support — one accountable team.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Advanced interfaces<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:5px\">Interfaces that work for non-technical users on their first attempt.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Modular architecture<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:5px\">Systems designed so the next requirement doesn't mean a rewrite.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Security by design<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:5px\">Payments, permissions and personal data handled properly from day one.<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Ongoing support<\u002Fdiv><div style=\"font-size:14.5px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:5px\">Updates, monitoring and improvements long after the launch week.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"process\" style=\"background:#f5f6fb;color:#0d1030;padding:84px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:38px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:#383f87\">HOW WE WORK<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(13,16,48,.15)\"><\u002Fspan><\u002Fdiv>\n<h2 style=\"margin:0 0 40px;font-size:38px;letter-spacing:-.035em;font-weight:700;max-width:26ch\">Seven steps, in this order, every time.<\u002Fh2>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px\">\n<div data-lift=\"\" style=\"background:#fff;border:1px solid rgba(13,16,48,.1);border-radius:14px;padding:20px\"><div style=\"font:500 22px/1 IBM Plex Mono,monospace;color:rgba(56,63,135,.4)\">01<\u002Fdiv><div style=\"font-size:15.5px;font-weight:700;letter-spacing:-.02em;margin-top:14px\">Identify a real need<\u002Fdiv><\u002Fdiv>\n<div data-lift=\"\" style=\"background:#fff;border:1px solid rgba(13,16,48,.1);border-radius:14px;padding:20px\"><div style=\"font:500 22px/1 style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220);margin-bottom:26px\">INNOVATION<\u002Fdiv>\n<h2 style=\"margin:0;font-size:38px;line-height:1.08;letter-spacing:-.035em;font-weight:700;max-width:20ch\">We look where nobody built software yet.<\u002Fh2>\n<p style=\"margin:20px 0 0;font-size:16.5px;line-height:1.65;color:rgba(238,240,250,.66);max-width:52ch\">Diving clubs and religious institutions have little in common — except that both were running on processes no software had ever properly addressed. That pattern is our method: find the traditional market, map the process worth improving, apply modern technology, and keep the result simple enough that anyone can use it.<\u002Fp>\n<\u002Fdiv>\n<div style=\"display:grid;gap:12px;padding-top:52px\">\n<div style=\"display:flex;gap:16px;align-items:baseline;background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:18px 22px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">01<\u002Fspan><span style=\"font-size:16px\">Identify traditional markets<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;align-items:baseline;background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:18px 22px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">02<\u002Fspan><span style=\"font-size:16px\">Map the processes worth improving<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;align-items:baseline;background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:18px 22px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">03<\u002Fspan><span style=\"font-size:16px\">Apply advanced technology<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;align-items:baseline;background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:18px 22px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">04<\u002Fspan><span style=\"font-size:16px\">Keep the product simple to operate<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:16px;align-items:baseline;background:rgba(238,240,250,.05);border:1px solid rgba(238,240,250,.11);border-radius:14px;padding:18px 22px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;color:oklch(78% .12 220)\">05<\u002Fspan><span style=\"font-size:16px\">Make user experience the priority<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"technology\" style=\"padding:0 60px 84px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:30px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220)\">TECHNOLOGY<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(238,240,250,.18)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:10px;font-size:14.5px\">\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">Flutter<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">Firebase<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">Google Cloud<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">iOS<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">Android<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">Apple Technologies<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,.2)\">REST APIs<\u002Fspan>\n<span data-lift=\"\" style=\"padding:11px 20px;border-radius:99px;border:1px solid rgba(238,240,250,. need.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px solid rgba(13,16,48,.15);padding-top:12px\"><div style=\"font-size:16px;font-weight:700\">Reliability<\u002Fdiv><div style=\"font-size:13.5px;color:rgba(13,16,48,.58);margin-top:3px\">Systems that behave the same on day 900.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px solid rgba(13,16,48,.15);padding-top:12px\"><div style=\"font-size:16px;font-weight:700\">Simplicity<\u002Fdiv><div style=\"font-size:13.5px;color:rgba(13,16,48,.58);margin-top:3px\">Fewer screens, fewer decisions, less training.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px solid rgba(13,16,48,.15);padding-top:12px\"><div style=\"font-size:16px;font-weight:700\">Quality<\u002Fdiv><div style=\"font-size:13.5px;color:rgba(13,16,48,.58);margin-top:3px\">Tested, documented, reviewed before release.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px solid rgba(13,16,48,.15);padding-top:12px\"><div style=\"font-size:16px;font-weight:700\">Transparency<\u002Fdiv><div style=\"font-size:13.5px;color:rgba(13,16,48,.58);margin-top:3px\">Clear scope, clear status, no surprises.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:1px solid rgba(13,16,48,.15);padding-top:12px\"><div style=\"font-size:16px;font-weight:700\">Long-term partnership<\u002Fdiv><div style=\"font-size:13.5px;color:rgba(13,16,48,.58);margin-top:3px\">We stay with the product for years.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:84px 60px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:38px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220)\">WHERE WE'RE GOING<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(238,240,250,.18)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px\">\n<div style=\"border-top:2px solid oklch(72% .13 220);padding-top:16px\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">More products<\u002Fdiv><div style=\"font-size:14px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:6px\">New platforms for markets we're already studying.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:2px solid rgba(238,240,250,.2);padding-top:16px\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">International markets<\u002Fdiv><div style=\"font-size:14px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:6px\">Products built multilingual from the start.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:2px solid rgba(238,240,250,.2);padding-top:16px\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Deeper AI<\u002Fdiv><div style=\"font-size:14px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:6px\">Assistance and automation inside our platforms.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:2px solid rgba(238,240,250,.2);padding-top:16px\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">More partnerships<\u002Fdiv><div style=\"font-size:14px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:6px\">Working with organisations inside their own field.<\u002Fdiv><\u002Fdiv>\n<div style=\"border-top:2px solid rgba(238,240,250,.2);padding-top:16px\"><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">A product ecosystem<\u002Fdiv><div style=\"font-size:14px;line-height:1.55;color:rgba(238,240,250,.6);margin-top:6px\">Shared infrastructure across everything we build.<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:0 60px 84px\">\n<div style=\"display:flex;align-items:baseline;gap:14px;margin-bottom:30px\"><span style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:oklch(78% .12 220)\">FAQ<\u002Fspan><span style=\"flex:1;height:1px;background:rgba(238,240,250,.18)\"><\u002Fspan><\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:14px 40px\">\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">What does the company do?<\u002Fdiv><p style=\"margin:7px 0 0;font-size:14.5px;line-height:1.6;color:rgba(238,240,250,.62)\">We develop digital platforms and custom systems — mobile, web, cloud and AI — both as our own products and for client organisations.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Which products do you build?<\u002Fdiv><p style=\"margin:7px 0 0;font-size:14.5px;line-height:1.6;color:rgba(238,240,250,.62)\">Today: Dolphin for the diving world and Machatzit HaShekel for institutions and non-profits. More are in development.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">How can we work together?<\u002Fdiv><p style=\"margin:7px 0 0;font-size:14.5px;line-height:1.6;color:rgba(238,240,250,.62)\">Send us the problem you're trying to solve. We'll come back with a scope, a plan and an honest view of whether we're the right team.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Can we see a demo?<\u002Fdiv><p style=\"margin:7px 0 0;font-size:14.5px;line-height:1.6;color:rgba(238,240,250,.62)\">Yes — both products can be demonstrated live, including the admin side.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Do you build custom solutions?<\u002Fdiv><p style=\"margin:7px 0 0;font-size:14.5px;line-height:1.6;color:rgba(238,240,250,.62)\">Yes. Much of our work is systems built specifically for an organisation's processes.<\u002Fp><\u002Fdiv>\n<div><div style=\"font-size:17px;font-weight:700;letter-spacing:-.02em\">Where are you based?<\u002Fdiv><p style=\"margin:7px 0 0;font-size:14.5px;line-height:1.6;color:rgba(238,240,250,.62)\">Swed Technology LTD is a private Israeli company, incorporated in 2024, working with clients locally and abroad.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div id=\"contact\" style=\"background:#f5f6fb;color:#0d1030;padding:84px 60px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:72px;align-items:start\">\n<div>\n<div style=\"font:500 11px/1 IBM Plex Mono,monospace;letter-spacing:.16em;color:#383f87;margin-bottom:24px\">CONTACT<\u002Fdiv>\n<h2 style=\"margin:0;font-size:42px;line-height:1.06;letter-spacing:-.035em;font-weight:700;max-width:18ch\">Tell us what you're trying to solve.<\u002Fh2>\n<p style=\"margin:18px 0 0;font-size:16.5px;line-height:1.65;color:rgba(13,16,48,.66);max-width:46ch\">Whether it's a new product, an existing system that needs rebuilding, or a demo of one of ours — we'll answer within one business day.<\u002Fp>\n<div style=\"display:grid;gap:12px;margin-top:32px;font-size:15px\">\n<div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.45);width:70px\">EMAIL<\u002Fspan><span style=\"font:400 13px/1 IBM Plex Mono,monospace;color:rgba(13,16,48,.5);border:1px dashed rgba(13,16,48,.3);padding:7px 10px\">— add email —<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.45);width:70px\">PHONE<\u002Fspan><span style=\"font:400 13px/1 IBM Plex Mono,monospace;color:rgba(13,16,48,.5);border:1px dashed rgba(13,16,48,.3);padding:7px 10px\">— add phone —<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.45);width:70px\">ADDRESS<\u002Fspan><span style=\"font-size:15px;color:rgba(13,16,48,.8)\">Derech Menachem Begin 156, Tel Aviv<\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;gap:12px;align-items:center\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.45);width:70px\">LINKEDIN<\u002Fspan><span style=\"font:400 13px/1 IBM Plex Mono,monospace;color:rgba(13,16,48,.5);border:1px dashed rgba(13,16,48,.3);padding:7px 10px\">— add profile —<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"background:#fff;border:1px solid rgba(13,16,48,.1);border-radius:18px;padding:30px;display:grid;gap:16px\">\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<label style=\"display:grid;gap:7px\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.5)\">NAME<\u002Fspan><input type=\"text\" placeholder=\"Full name\" style=\"padding:12px 14px;border:1px solid rgba(13,16,48,.16);border-radius:10px;font-size:14.5px;color:#0d1030;background:#fff\"><\u002Flabel>\n<label style=\"display:grid;gap:7px\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.5)\">ORGANISATION<\u002Fspan><input type=\"text\" placeholder=\"Company or institution\" style=\"padding:12px 14px;border:1px solid rgba(13,16,48,.16);border-radius:10px;font-size:14.5px;color:#0d1030;background:#fff\"><\u002Flabel>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:1fr 1fr;gap:16px\">\n<label style=\"display:grid;gap:7px\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.5)\">EMAIL<\u002Fspan><input type=\"email\" placeholder=\"you@company.com\" style=\"padding:12px 14px;border:1px solid rgba(13,16,48,.16);border-radius:10px;font-size:14.5px;color:#0d1030;background:#fff\"><\u002Flabel>\n<label style=\"display:grid;gap:7px\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.5)\">PHONE<\u002Fspan><input type=\"tel\" placeholder=\"Optional\" style=\"padding:12px 14px;border:1px solid rgba(13,16,48,.16);border-radius:10px;font-size:14.5px;color:#0d1030;background:#fff\"><\u002Flabel>\n<\u002Fdiv>\n<label style=\"display:grid;gap:7px\"><span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.1em;color:rgba(13,16,48,.5) -content:space-between;margin-bottom:14px\">\n<span style=\"font:500 10.5px/1 IBM Plex Mono,monospace;letter-spacing:.14em;color:rgba(238,240,250,.55)\">ACCESSIBILITY<\u002Fspan>\n<span sc-camel-on-click=\"{{ toggleA11y }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"Close accessibility menu\" style=\"cursor:pointer;font-size:16px;line-height:1;color:rgba(238,240,250,.6);padding:2px 4px\">✕<\u002Fspan>\n<\u002Fdiv>\n<div style=\"display:flex;align-items:center;justify-content:space-between;background:rgba(238,240,250,.06);border-radius:10px;padding:9px 12px;margin-bottom:8px\">\n<span style=\"font-size:14px\">Text size<\u002Fspan>\n<div style=\"display:flex;align-items:center;gap:8px\">\n<span sc-camel-on-click=\"{{ textSmaller }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"Decrease text size\" style=\"cursor:pointer;width:26px;height:26px;border-radius:7px;border:1px solid rgba(238,240,250,.22);display:flex;align-items:center;justify-content:center;font-size:15px\">−<\u002Fspan>\n<span style=\"font:500 11px/1 IBM Plex Mono,monospace;min-width:34px;text-align:center;color:rgba(238,240,250,.7)\">{{ zoomLabel }}<\u002Fspan>\n<span sc-camel-on-click=\"{{ textLarger }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"Increase text size\" style=\"cursor:pointer;width:26px;height:26px;border-radius:7px;border:1px solid rgba(238,240,250,.22);display:flex;align-items:center;justify-content:center;font-size:15px\">+<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;gap:6px\">\n<div sc-camel-on-click=\"{{ toggleContrast }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:rgba(238,240,250,.06);border-radius:10px;padding:10px 12px;font-size:14px\"><span>High contrast<\u002Fspan><span style=\"font:500 10px/1 IBM Plex Mono,monospace;color:rgba(238,240,250,.6)\">{{ contrastLabel }}<\u002Fspan><\u002Fdiv>\n<div sc-camel-on-click=\"{{ toggleGrayscale }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:rgba(238,240,250,.06);border-radius:10px;padding:10px 12px;font-size:14px\"><span>Grayscale<\u002Fspan><span style=\"font:500 10px/1 IBM Plex Mono,monospace;color:rgba(238,240,250,.6)\">{{ grayLabel }}<\u002Fspan><\u002Fdiv>\n<div sc-camel-on-click=\"{{ toggleUnderline }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:rgba(238,240,250,.06);border-radius:10px;padding:10px 12px;font-size:14px\"><span>Underline links<\u002Fspan><span style=\"font:500 10px/1 IBM Plex Mono,monospace;color:rgba(238,240,250,.6)\">{{ underlineLabel }}<\u002Fspan><\u002Fdiv>\n<div sc-camel-on-click=\"{{ toggleMotion }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"cursor:pointer;display:flex;align-items:center;justify-content:space-between;background:rgba(238,240,250,.06);border-radius:10px;padding:10px 12px;font-size:14px\"><span>Stop animations<\u002Fspan><span style=\"font:500 10px/1 IBM Plex Mono,monospace;color:rgba(238,240,250,.6)\">{{ motionLabel }}<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div sc-camel-on-click=\"{{ resetA11y }}\" role=\"button\" sc-camel-tab-index=\"0\" style=\"cursor:pointer;margin-top:12px;text-align:center;font-size:13px;font-weight:700;padding:11px;border-radius:99px;background:oklch(72% .13 220);color:#0d1030\">Reset settings<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<div sc-camel-on-click=\"{{ toggleA11y }}\" role=\"button\" sc-camel-tab-index=\"0\" aria-label=\"Accessibility menu\" title=\"Accessibility\" style=\"cursor:pointer;width:52px;height:52px;border-radius:50%;background:oklch(72% .13 220);color:#0d1030;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 26px rgba(0,0,0,.35)\">\n<svg width=\"26\" height=\"26\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"4.4\" r=\"1.9\" fill=\"currentColor\" stroke=\"none\"><\u002Fcircle><path d=\"M4.6 8.2h14.8\"><\u002Fpath><path d=\"M9.4 8.6v4.2l-1.6 7.4\"><\u002Fpath><path d=\"M14.6 8.6v4.2l1.6 7.4\"><\u002Fpath><path d=\"M9.4 12.8h5.2\"><\u002Fpath><\u002Fsvg>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<\u002Fdiv>\n\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { a11yOpen: false, zoom: 1, contrast: false, grayscale: false, underline: false, stopMotion: false };\n\n  applyA11y() {\n    const { zoom, contrast, grayscale, underline, stopMotion } = this.state;\n    let el = document.getElementById('a11y-overrides');\n    if (!el) { el = document.createElement('style'); el.id = 'a11y-overrides'; document.head.appendChild(el); }\n    const filters = [contrast ? 'contrast(1.35) saturate(1.25)' : '', grayscale ? 'grayscale(1)' : ''].filter(Boolean).join(' ');\n    el.textContent = [\n      `[data-site-root]{zoom:${zoom};${filters ? `filter:${filters};` : ''}}`,\n      underline ? '[data-site-root] a{text-decoration:underline !important;text-underline-offset:3px}' : '',\n      stopMotion ? '[data-site-root] *,[data-a11y] *{animation:none !important;transition:none !important}' : ''\n    ].join('\\n');\n  }\n  componentDidUpdate() { this.applyA11y(); }\n\n  componentDidMount() {\n    if (window.matchMedia('(prefers-reduced-motion:reduce)').matches) return;\n    const root = document.querySelector('[data-site-root]');\n    if (!root) return;\n    const items = [];\n    [...root.children].forEach(sec => {\n      if (sec.hasAttribute('data-nostagger')) return;\n      const kids = [...sec.children].filter(k => getComputedStyle(k).position !== 'absolute');\n      (kids.length ? kids : [sec]).forEach(k => items.push(k));\n    });\n    items.forEach((el, i) => {\n      el.style.opacity = '0';\n      el.style.transform = 'translateY(18px)';\n      el.style.transition = 'opacity .65s ease, transform .7s cubic-bezier(.2,.7,.3,1)';\n      el.dataset.delay = String((i % 3) * 80);\n    });\n    const show = (el, delay) => {\n      io.unobserve(el);\n      setTimeout(() => { el.style.opacity = '1'; el.style.transform = 'none'; }, delay);\n    };\n    const io = new IntersectionObserver(entries => {\n      entries.forEach(e => {\n        // reveal when visible OR already scrolled past (anchor jumps skip intersections)\n        if (!e.isIntersecting && e.boundingClientRect.top > 0) return;\n        show(e.target, e.isIntersecting ? Number(e.target.dataset.delay || 0) : 0);\n      });\n    }, { threshold: 0, rootMargin: '0px 0px -6% 0px' });\n    items.forEach(el => io.observe(el));\n    // safety net: nothing may stay stranded at opacity 0\n    const sweep = () => items.forEach(el => {\n      if (el.style.opacity === '0' && el.getBoundingClientRect().top < window.innerHeight) show(el, 0);\n    });\n    setTimeout(sweep, 1200);\n    window.addEventListener('scroll', sweep, { passive: true });\n  }\n  renderVals() {\n    const s = this.state;\n    const on = v => (v ? 'ON' : 'OFF');\n    const set = patch => this.setState(patch);\n    return {\n      goHe: () => alert('Hebrew version — coming in the next pass'),\n      a11yOpen: s.a11yOpen,\n      toggleA11y: () => set({ a11yOpen: !s.a11yOpen }),\n      zoomLabel: Math.round(s.zoom * 100) + '%',\n      textLarger: () => set({ zoom: Math.min(1.4, +(s.zoom + 0.1).toFixed(2)) }),\n      textSmaller: () => set({ zoom: Math.max(0.9, +(s.zoom - 0.1).toFixed(2)) }),\n      contrastLabel: on(s.contrast), toggleContrast: () => set({ contrast: !s.contrast }),\n      grayLabel: on(s.grayscale), toggleGrayscale: () => set({ grayscale: !s.grayscale }),\n      underlineLabel: on(s.underline), toggleUnderline: () => set({ underline: !s.underline }),\n      motionLabel: on(s.stopMotion), toggleMotion: () => set({ stopMotion: !s.stopMotion }),\n      resetA11y: () => set({ zoom: 1, contrast: false, grayscale: false, underline: false, stopMotion: false })\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
